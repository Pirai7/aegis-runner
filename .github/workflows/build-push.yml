name: Build and Push Container

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: aegisrunnerreg01.azurecr.io
          username: aegisrunnerreg01
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Container Image to GHCR and Azure ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pirai7/aegis-runner:v1
            ghcr.io/pirai7/aegis-runner:latest
            aegisrunnerreg01.azurecr.io/aegis-runner:v1
            aegisrunnerreg01.azurecr.io/aegis-runner:latest
