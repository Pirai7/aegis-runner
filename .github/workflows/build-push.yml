name: Build & Push Container to Azure ACR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t aegisrunnerreg01.azurecr.io/aegis-runner:v1 .
      
      - name: Log in to Azure Container Registry
        if: ${{ secrets.ACR_PASSWORD != '' }}
        uses: azure/docker-login@v2
        with:
          login-server: aegisrunnerreg01.azurecr.io
          username: aegisrunnerreg01
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push Docker Image
        if: ${{ secrets.ACR_PASSWORD != '' }}
        run: |
          docker push aegisrunnerreg01.azurecr.io/aegis-runner:v1

      - name: Skip push when ACR password is unavailable
        if: ${{ secrets.ACR_PASSWORD == '' }}
        run: echo "ACR_PASSWORD is not configured; image push was skipped."
